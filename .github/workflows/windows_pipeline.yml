name: Windows Build Pipeline

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Dependencies
        run: |
          uv sync --all-extras
          # Asegurar que Nuitka esté disponible en el entorno de uv
          uv pip install nuitka zstandard ordered-set

      - name: Build Standalone Binary (Production)
        run: |
          uv run python scripts/build_binary.py
        shell: pwsh

      - name: Package Standalone for Release
        run: |
          if (Test-Path "data") { Copy-Item -Path data -Destination dist/main.dist/data -Recurse }
          Compress-Archive -Path dist/main.dist/* -DestinationPath dist/AYL-POS-Windows.zip
        shell: pwsh

      - name: Remove Production Executable
        run: |
          Remove-Item -Path dist/main.dist/AYL-POS.exe -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Standalone Binary (Debug/Console)
        run: |
          uv run python scripts/build_binary.py --enable-console
        shell: pwsh

      - name: Package Debug Release
        run: |
          if (Test-Path "data") { Copy-Item -Path data -Destination dist/main.dist/data -Recurse }
          Compress-Archive -Path dist/main.dist/* -DestinationPath dist/AYL-POS-Windows-Debug.zip
        shell: pwsh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AYL-POS-Windows-Standalone
          path: |
            dist/AYL-POS-Windows.zip
            dist/AYL-POS-Windows-Debug.zip
            README.md
          if-no-files-found: error

      - name: Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AYL-POS-Windows.zip
            dist/AYL-POS-Windows-Debug.zip
            README.md
          generate_release_notes: true
