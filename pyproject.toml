[project]
name = "ayl-pos"
version = "0.1.0"
description = "Soporte Tecnico A&L Punto De Venta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet[all]>=0.83.0",
    "pyusb>=0.2; platform_system!='Windows'",
    "pywin32>=306; platform_system=='Windows'",
    "portalocker>=2.10.0; platform_system=='Windows'",
    "python-escpos>=3.1",
    "tkcalendar>=1.6.1",
]

[tool.setuptools]
packages = ["src", "src.core", "src.gui", "src.app_platform"]
